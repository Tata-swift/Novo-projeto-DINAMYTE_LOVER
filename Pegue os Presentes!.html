<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pegue os Presentes!</title>
<style>
  :root { --fundo:#fdeef4; --texto:#6a4580; box-sizing:border-box;
          padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fundo:#241a33; --texto:#f3d9ff; }
  }
  body { margin:0; background:var(--fundo); color:var(--texto); font-family:system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; padding:12px; }
  canvas { width:min(360px,100%); aspect-ratio:3/4; border-radius:22px; touch-action:none;
           box-shadow:0 12px 36px rgba(200,100,200,.4); }
  p { margin:10px 0; text-align:center; font-size:14px; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<p>← → (ou A e D) ou arraste o dedo/mouse · Pegue os presentes e fuja das bombas ✨</p>

<script>
// 1) Canvas nítido: o tamanho "lógico" do jogo é 360x480, mas desenhamos em alta resolução
const L = 360, A = 480;
const canvas = document.getElementById("tela");
const ctx = canvas.getContext("2d");
const dpr = window.devicePixelRatio || 1;
canvas.width = L * dpr; canvas.height = A * dpr;
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

// 2) Variáveis do jogo
let caminhao, itens, brilhos, pontos, vidas, fimDeJogo, contador, glitterTempo, avisoVida;
let quadro = 0;                       // conta os quadros (usado nas animações)
const teclas = {};
const coresGlitter = ["#ffffff", "#ffd6e8", "#e6d6ff", "#fff3a3", "#c9f1ff"];
// cores dos presentes: rosa, azul, amarelo e verde (claras)
const presentes = [
  { claro: "#ffd6e6", escuro: "#f5a3c4" },
  { claro: "#cdeaff", escuro: "#8cc6ee" },
  { claro: "#fff4b8", escuro: "#efd36a" },
  { claro: "#d3f7dc", escuro: "#8fd3a5" }
];
const estrelas = Array.from({ length: 30 }, () => ({ x: Math.random() * L, y: Math.random() * 300, r: 1 + Math.random() * 2 }));

// 3) Começa (ou recomeça) o jogo
function iniciar() {
  caminhao = { x: 132, y: 418, largura: 96, altura: 46 };
  itens = [];                         // presentes e bombas caindo
  brilhos = [];                       // partículas de glitter
  pontos = 0; vidas = 3;
  glitterTempo = 0; avisoVida = 0;
  fimDeJogo = false; contador = 0;
}

// 4) Teclado, mouse e toque
addEventListener("keydown", e => {
  teclas[e.key.toLowerCase()] = true;
  if (e.key === "Enter" && fimDeJogo) iniciar();
});
addEventListener("keyup", e => teclas[e.key.toLowerCase()] = false);
canvas.addEventListener("pointermove", e => {
  const area = canvas.getBoundingClientRect();
  caminhao.x = (e.clientX - area.left) * (L / area.width) - caminhao.largura / 2;
});
canvas.addEventListener("pointerdown", () => { if (fimDeJogo) iniciar(); });

// 5) Perder uma vida (usada em dois lugares do jogo)
function perderVida() {
  vidas -= 1;
  if (vidas <= 0) fimDeJogo = true;
}

// 6) Atualiza posições (~60 vezes por segundo)
function atualizar() {
  quadro++;
  if (avisoVida > 0) avisoVida--;

  // glitter (continua caindo mesmo no fim de jogo)
  if (glitterTempo > 0) {
    glitterTempo--;
    for (let i = 0; i < 4; i++) {
      brilhos.push({ x: Math.random() * L, y: -10, vy: 1.2 + Math.random() * 2.2, vx: Math.random() - 0.5,
                     r: 2 + Math.random() * 4, cor: coresGlitter[Math.floor(Math.random() * coresGlitter.length)], fase: Math.random() * 6 });
    }
  }
  for (const b of brilhos) { b.y += b.vy; b.x += b.vx; }
  brilhos = brilhos.filter(b => b.y < A + 10);

  if (fimDeJogo) return;

  if (teclas["arrowleft"]  || teclas["a"]) caminhao.x -= 6;
  if (teclas["arrowright"] || teclas["d"]) caminhao.x += 6;
  caminhao.x = Math.max(0, Math.min(L - caminhao.largura, caminhao.x));

  // a cada ~50 quadros nasce um item novo; 1 de cada 4 é bomba
  contador++;
  if (contador % 50 === 0) {
    itens.push({ x: Math.random() * (L - 34), y: -40, tam: 34, bomba: Math.random() < 0.25,
                 cor: presentes[Math.floor(Math.random() * presentes.length)] });
  }

  const velocidade = 2.5 + pontos * 0.04;     // quanto mais pontos, mais rápido
  for (const c of itens) c.y += velocidade;

  itens = itens.filter(c => {
    const pegou = c.y + c.tam >= caminhao.y && c.y <= caminhao.y + caminhao.altura &&
                  c.x + c.tam >= caminhao.x && c.x <= caminhao.x + caminhao.largura;
    if (pegou && c.bomba) { perderVida(); return false; }      // bomba: perde 1 vida
    if (pegou) {                                               // presente: +1 ponto
      pontos += 1;
      if (pontos % 5 === 0) glitterTempo = 180;                // a cada 5: chuva de glitter
      if (pontos % 50 === 0) { vidas += 1; avisoVida = 120; }  // a cada 50: +1 vida
      return false;
    }
    if (c.y > A && c.bomba) return false;                      // bomba no chão some
    if (c.y > A) { pontos -= 3; perderVida(); return false; }  // presente perdido: -3 e -1 vida
    return true;
  });
}

// 7) Formas prontas
function brilho(x, y, r) {            // brilho de 4 pontas
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);
  ctx.fill();
}
function coracao(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x - s, y - s * 0.5, x - s * 0.5, y - s * 1.2, x, y - s * 0.5);
  ctx.bezierCurveTo(x + s * 0.5, y - s * 1.2, x + s, y - s * 0.5, x, y + s * 0.3);
  ctx.fill();
}

// 8) Presente pastel com fita e laço
function presente(x, y, t, p) {
  const g = ctx.createLinearGradient(x, y, x, y + t);
  g.addColorStop(0, p.claro); g.addColorStop(1, p.escuro);
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x, y, t, t, 6); ctx.fill();
  ctx.strokeStyle = "rgba(120,70,140,0.25)"; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = "#fff";                                        // fitas em cruz
  ctx.fillRect(x + t / 2 - 3, y, 6, t);
  ctx.fillRect(x, y + t / 2 - 3, t, 6);
  ctx.fillStyle = "rgba(255,255,255,0.5)";                       // reflexo
  ctx.beginPath(); ctx.roundRect(x + 4, y + 4, 7, 3, 2); ctx.fill();
  const cx = x + t / 2;                                          // laço no topo
  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.ellipse(cx - 6, y - 2, 7, 4, -0.5, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + 6, y - 2, 7, 4, 0.5, 0, 7); ctx.fill();
  ctx.fillStyle = p.escuro; ctx.beginPath(); ctx.arc(cx, y - 1, 3, 0, 7); ctx.fill();
}

// 9) Bomba metálica com pavio
function bomba(x, y, r) {
  const aviso = ctx.createRadialGradient(x, y, r * 0.8, x, y, r * 2);             // brilho de alerta
  aviso.addColorStop(0, "rgba(255,70,90,0.3)"); aviso.addColorStop(1, "rgba(255,70,90,0)");
  ctx.fillStyle = aviso; ctx.beginPath(); ctx.arc(x, y, r * 2, 0, 7); ctx.fill();
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.1, x, y, r);
  g.addColorStop(0, "#7a7088"); g.addColorStop(1, "#0e0a14");
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = "#2b2233"; ctx.fillRect(x - r * 0.25, y - r * 1.15, r * 0.5, r * 0.3);
  ctx.strokeStyle = "#c9a77a"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y - r * 1.1); ctx.quadraticCurveTo(x + r * 0.4, y - r * 1.7, x + r * 0.9, y - r * 1.4); ctx.stroke();
  ctx.fillStyle = quadro % 10 < 5 ? "#ff6a3c" : "#ffd23c";                        // faísca
  brilho(x + r * 0.9, y - r * 1.4, 6);
}

// 10) Cenário fofo: céu roxo e rosa, arco-íris, nuvens, corações e colinas
function desenharCenario() {
  const ceu = ctx.createLinearGradient(0, 0, 0, A);
  ceu.addColorStop(0, "#c9a7ff"); ceu.addColorStop(0.55, "#ffb3d9"); ceu.addColorStop(1, "#ffe3c2");
  ctx.fillStyle = ceu; ctx.fillRect(0, 0, L, A);

  ctx.fillStyle = "#fff";                                          // estrelinhas piscando
  estrelas.forEach((e, i) => { ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(quadro / 30 + i)); brilho(e.x, e.y, e.r * 2.5); });
  ctx.globalAlpha = 1;

  const sol = ctx.createRadialGradient(270, 120, 5, 270, 120, 60);     // sol rosado
  sol.addColorStop(0, "#fff6c9"); sol.addColorStop(0.5, "#ffd1e8"); sol.addColorStop(1, "rgba(255,209,232,0)");
  ctx.fillStyle = sol; ctx.beginPath(); ctx.arc(270, 120, 60, 0, 7); ctx.fill();

  const arco = ["#ffb3c1", "#ffd6a5", "#fdffb6", "#caffbf", "#9bf6ff", "#bdb2ff"];   // arco-íris pastel
  ctx.lineWidth = 9; ctx.globalAlpha = 0.45;
  arco.forEach((cor, i) => { ctx.strokeStyle = cor; ctx.beginPath(); ctx.arc(70, 440, 200 - i * 9, Math.PI, 2 * Math.PI * 0.93); ctx.stroke(); });
  ctx.globalAlpha = 1;

  ctx.fillStyle = "rgba(255,255,255,0.75)";                        // nuvens que andam devagar
  for (const [nx, ny] of [[60, 90], [220, 200]]) {
    const x = (nx + quadro * 0.2) % 440 - 40;
    ctx.beginPath(); ctx.arc(x, ny, 16, 0, 7); ctx.arc(x + 18, ny - 8, 20, 0, 7); ctx.arc(x + 40, ny, 16, 0, 7); ctx.fill();
  }

  for (let i = 0; i < 7; i++) {                                    // corações flutuando para cima
    const cx = (i * 53 + 25) % L + Math.sin(quadro / 50 + i) * 8;
    const cy = 470 - ((quadro * 0.4 + i * 70) % 470);
    ctx.fillStyle = i % 2 ? "rgba(255,255,255,0.6)" : "rgba(255,158,203,0.6)";
    coracao(cx, cy, 6);
  }

  ctx.fillStyle = "#e7b6ff"; ctx.beginPath(); ctx.ellipse(80, 480, 220, 90, 0, 0, 7); ctx.fill();    // colinas
  ctx.fillStyle = "#ffc2dc"; ctx.beginPath(); ctx.ellipse(300, 490, 230, 70, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffe0ec"; ctx.fillRect(0, 462, L, 18);          // chão
}

// 11) Caminhão decorado: metálico rosé, vidro e luzinhas
function desenharCaminhao() {
  const { x, y, largura: w, altura: h } = caminhao;
  ctx.fillStyle = "rgba(120,60,140,0.25)";                               // sombra no chão
  ctx.beginPath(); ctx.ellipse(x + w / 2, y + h + 2, w * 0.55, 5, 0, 0, 7); ctx.fill();

  const carga = ctx.createLinearGradient(x, y, x, y + h);                // carroceria
  carga.addColorStop(0, "#ffb3d1"); carga.addColorStop(1, "#ee6fa6");
  ctx.fillStyle = carga; ctx.beginPath(); ctx.roundRect(x, y, w * 0.68, h - 10, 6); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1;
  for (const px of [0.22, 0.44]) { ctx.beginPath(); ctx.moveTo(x + w * px, y + 3); ctx.lineTo(x + w * px, y + h - 13); ctx.stroke(); }
  ctx.fillStyle = "#fff"; ctx.fillRect(x, y + h * 0.55, w * 0.68, 3);    // faixa branca
  coracao(x + w * 0.34, y + 17, 6);

  const cab = ctx.createLinearGradient(x, y, x, y + h);                  // cabine lilás
  cab.addColorStop(0, "#b99cff"); cab.addColorStop(1, "#7f5fc9");
  ctx.fillStyle = cab; ctx.beginPath(); ctx.roundRect(x + w * 0.7, y + 8, w * 0.3, h - 18, 7); ctx.fill();
  const vidro = ctx.createLinearGradient(x, y, x, y + 24);               // vidro com reflexo
  vidro.addColorStop(0, "#e4f6ff"); vidro.addColorStop(1, "#9cc3ea");
  ctx.fillStyle = vidro; ctx.beginPath(); ctx.roundRect(x + w * 0.74, y + 12, w * 0.19, 11, 4); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.8)";
  ctx.beginPath(); ctx.moveTo(x + w * 0.78, y + 22); ctx.lineTo(x + w * 0.82, y + 13); ctx.stroke();

  ctx.fillStyle = "#fff6d6"; ctx.fillRect(x + 2, y + h - 12, w - 4, 3);   // para-choque
  ctx.fillStyle = "#fff3a3"; ctx.beginPath(); ctx.arc(x + w - 3, y + h - 16, 3, 0, 7); ctx.fill();

  for (const rx of [x + 22, x + w - 20]) {                               // rodas
    ctx.fillStyle = "#4b3860"; ctx.beginPath(); ctx.arc(rx, y + h - 6, 10, 0, 7); ctx.fill();
    ctx.fillStyle = "#ffd6e8"; ctx.beginPath(); ctx.arc(rx, y + h - 6, 5, 0, 7); ctx.fill();
  }

  ctx.fillStyle = "#fff";                                                // pisca-pisca no teto
  for (let i = 0; i < 6; i++) {
    ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(quadro / 18 + i));
    brilho(x + 8 + i * 10.5, y - 3, 4);
  }
  ctx.globalAlpha = 1;
}

// 12) Painel do placar (vidro claro)
function painel(px, rotulo, valor) {
  ctx.fillStyle = "rgba(255,255,255,0.65)";
  ctx.beginPath(); ctx.roundRect(px, 10, 112, 44, 14); ctx.fill();
  ctx.fillStyle = "#8a6aa3"; ctx.textAlign = "left";
  ctx.font = "600 10px system-ui, sans-serif"; ctx.fillText(rotulo, px + 14, 27);
  ctx.fillStyle = "#5a3a6b"; ctx.font = "600 20px system-ui, sans-serif"; ctx.fillText(valor, px + 14, 47);
}

// 13) Desenha tudo
function desenhar() {
  desenharCenario();

  for (const c of itens) {
    if (c.bomba) bomba(c.x + 17, c.y + 20, 14);
    else presente(c.x, c.y, c.tam, c.cor);
  }
  desenharCaminhao();

  for (const b of brilhos) {                                             // glitter caindo
    ctx.globalAlpha = 0.5 + 0.5 * Math.abs(Math.sin(quadro / 6 + b.fase));
    ctx.fillStyle = b.cor; brilho(b.x, b.y, b.r);
  }
  ctx.globalAlpha = 1;

  painel(10, "PONTOS", pontos);
  painel(238, "VIDAS", vidas);
  ctx.fillStyle = "#ff7fb0"; coracao(318, 31, 5);

  ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  ctx.shadowColor = "rgba(120,60,140,0.6)"; ctx.shadowBlur = 6;
  if (glitterTempo > 0 && !fimDeJogo) { ctx.font = "600 20px system-ui, sans-serif"; ctx.fillText("Chuva de glitter!", 180, 88); }
  if (avisoVida > 0) { ctx.font = "600 24px system-ui, sans-serif"; ctx.fillText("+1 vida!", 180, 120); }
  ctx.shadowBlur = 0;

  if (fimDeJogo) {                                                       // fim de jogo
    ctx.fillStyle = "rgba(90,50,120,0.55)"; ctx.fillRect(0, 0, L, A);
    ctx.fillStyle = "rgba(255,255,255,0.25)";
    ctx.beginPath(); ctx.roundRect(40, 150, 280, 190, 20); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = "600 30px system-ui, sans-serif"; ctx.fillText("Fim de jogo!", 180, 200);
    ctx.font = "18px system-ui, sans-serif";
    ctx.fillText("Você fez " + pontos + " pontos", 180, 240);
    ctx.fillText("Vidas restantes: 0", 180, 268);
    ctx.font = "15px system-ui, sans-serif";
    ctx.fillText("Enter ou toque para jogar de novo", 180, 315);
  }
}

// 14) O "coração" do jogo: atualiza, desenha e repete
function loop() { atualizar(); desenhar(); requestAnimationFrame(loop); }
iniciar();
loop();
</script>
</body>
</html>
